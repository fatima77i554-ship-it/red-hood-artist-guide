<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Что есть что · Грейбокс</title><link rel="stylesheet" href="atlas.css"></head><body><main><p class="eyebrow">КЛАССИФИКАТОР → ПОДПИСИ → ЭТАЛОН</p><h1>Что есть что.</h1><p>Подписи обозначают проверенные роли и исходные instance ID. Геометрия не меняется. Кандидаты не получают коллизий.</p><div id="rooms"></div></main><script src="greybox-data.js"></script><script src="motion.js"></script><script src="greybox.js"></script><script src="annotations.js"></script><script>for(const id of[45,34,23,262]){const r=GREYBOX_DATA.rooms[id],box=document.createElement('article');box.className='room-frame';box.style.marginBottom='20px';const lab=document.createElement('div');lab.className='frame-label';lab.textContent='ROOM'+String(id).padStart(3,'0')+' / подписи проверенных ролей';box.appendChild(lab);const c=document.createElement('canvas');c.width=r.width;c.height=r.height;const g=c.getContext('2d');g.drawImage(GREYBOX.canvasFor(id,false,2,true),0,0);GREYBOX_ANNOTATIONS.paint(g,GREYBOX_ANNOTATIONS.layout(id,2,(x,y)=>({x,y}),c.width,c.height));g.strokeStyle='#ffe08a';g.lineWidth=2;g.strokeRect(1,1,c.width-2,c.height-2);box.appendChild(c);document.querySelector('#rooms').appendChild(box)}window.ANNOTATION_GALLERY_READY=true;</script></body></html>
