<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Грейбокс · Галерея точных масок</title><link rel="stylesheet" href="atlas.css"></head><body><main><p class="eyebrow">КЛАССИФИКАТОР → ГАЛЕРЕЯ → ЭТАЛОН</p><h1>Грейбокс: точные маски.</h1><p>Диагностический вид проверенных ролей. Движение и игровые условия не симулируются. Кандидаты не становятся коллизиями.</p><div id="legend" class="greybox-legend"></div><div class="filters"><label><input id="supports" type="checkbox" checked> Опоры и pivot</label><a href="data/greybox-ui-classifier.json">Паспорта UI</a><a href="data/greybox.json">Привязки и маски</a></div><div id="rooms"></div></main><script src="greybox-data.js"></script><script src="motion.js"></script><script src="greybox.js"></script><script>const list=[30,23,45,34,110,151,262];document.querySelector('#legend').innerHTML=GREYBOX.legend();function render(){const root=document.querySelector('#rooms');root.replaceChildren();for(const id of list){const r=GREYBOX_DATA.rooms[id],box=document.createElement('article');box.className='room-frame';box.style.marginBottom='20px';const label=document.createElement('div');label.className='frame-label';label.textContent='ROOM'+String(id).padStart(3,'0')+' / '+r.width+'×'+r.height+' px';box.appendChild(label);const cv=document.createElement('canvas');cv.width=r.width;cv.height=r.height;const g=cv.getContext('2d');g.drawImage(GREYBOX.canvasFor(id,document.querySelector('#supports').checked),0,0);g.strokeStyle='#ffe08a';g.lineWidth=2;g.strokeRect(1,1,cv.width-2,cv.height-2);box.appendChild(cv);root.appendChild(box)}}document.querySelector('#supports').onchange=render;render();window.GREYBOX_GALLERY_READY=true;</script></body></html>
