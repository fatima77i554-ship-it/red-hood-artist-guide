<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Движение · Галерея масок</title><link rel="stylesheet" href="atlas.css"></head><body><main><p class="eyebrow">КЛАССИФИКАТОР → АНИМИРОВАННАЯ ГАЛЕРЕЯ → ЭТАЛОН</p><h1>Ход платформ и лифтов.</h1><p>19 исходных циклических платформ. Лифты и мост — демонстрация активации, без симуляции игрока или квестовых флагов. Пунктир соединяет подтверждённые крайние положения pivot.</p><div class="filters"><button id="play">Пауза</button><button id="reset">Сначала</button><label><input id="paths" type="checkbox" checked> Траектории</label><label><input id="supports" type="checkbox" checked> Опоры / pivot</label><span id="time"></span></div><div id="rooms"></div></main><script src="greybox-data.js"></script><script src="motion.js"></script><script src="greybox.js"></script><script>const list=[45,34,98,29,265],cvs=[];let time=0,last=0,playing=true;for(const id of list){const r=GREYBOX_DATA.rooms[id],box=document.createElement('article');box.className='room-frame';box.style.marginBottom='20px';const label=document.createElement('div');label.className='frame-label';label.textContent='ROOM'+String(id).padStart(3,'0')+' / '+r.width+'×'+r.height+' px';box.appendChild(label);const cv=document.createElement('canvas');cv.width=r.width;cv.height=r.height;box.appendChild(cv);document.querySelector('#rooms').appendChild(box);cvs.push([id,cv])}function draw(){for(const[id,c]of cvs){const g=c.getContext('2d');g.drawImage(GREYBOX.canvasFor(id,document.querySelector('#supports').checked,time,document.querySelector('#paths').checked),0,0);g.strokeStyle='#ffe08a';g.lineWidth=2;g.strokeRect(1,1,c.width-2,c.height-2)}document.querySelector('#time').textContent=time.toFixed(2)+' сек'}function loop(t){if(playing&&last)time+=(t-last)/1000;last=t;draw();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Пауза':'Продолжить'};document.querySelector('#reset').onclick=()=>{time=0;last=0;draw()};window.MOTION_GALLERY={setTime:t=>{playing=false;time=t;draw()}};draw();requestAnimationFrame(loop);window.MOTION_GALLERY_READY=true;</script></body></html>
